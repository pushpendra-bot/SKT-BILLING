<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skt-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#skt-gradient)" />
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.3" />

  <!-- Document / Billing Ledger Card with shadow -->
  <g filter="url(#shadow)">
    <!-- Main white card -->
    <path d="M 140 120 L 320 120 L 372 172 L 372 392 C 372 404 362 414 350 414 L 140 414 C 128 414 118 404 118 392 L 118 142 C 118 130 128 120 140 120 Z" fill="#ffffff" />
    
    <!-- Folded corner -->
    <path d="M 320 120 L 320 172 L 372 172 Z" fill="#e2e8f0" />
    <path d="M 320 172 L 372 172" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- SKT & Rupee Emblem Header -->
  <circle cx="170" cy="180" r="22" fill="#2563eb" />
  <text x="170" y="187" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">₹</text>

  <!-- Title / SKT text badge -->
  <text x="210" y="188" font-family="Arial, sans-serif" font-weight="800" font-size="26" fill="#1e293b" letter-spacing="1">SKT PRO</text>

  <!-- Divider line -->
  <line x1="150" y1="216" x2="340" y2="216" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

  <!-- Invoice row items -->
  <rect x="150" y="240" width="130" height="14" rx="7" fill="#3b82f6" />
  <rect x="300" y="240" width="40" height="14" rx="7" fill="#60a5fa" />

  <rect x="150" y="272" width="110" height="12" rx="6" fill="#94a3b8" />
  <rect x="290" y="272" width="50" height="12" rx="6" fill="#94a3b8" />

  <rect x="150" y="300" width="125" height="12" rx="6" fill="#94a3b8" />
  <rect x="305" y="300" width="35" height="12" rx="6" fill="#94a3b8" />

  <!-- Total Bar (Green / Emerald) -->
  <rect x="150" y="340" width="190" height="34" rx="8" fill="#10b981" />
  <text x="165" y="363" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#ffffff">PAID / GST</text>
  <text x="325" y="363" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#ffffff" text-anchor="end">✓</text>
</svg>
